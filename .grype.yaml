# Rules grype applies to the SBOM of the web image; it reads this file whole (-c). Each rule is one entry of
# .trivyignore.yaml in force, the same id and package version, where the reason and the date are (the backend's
# deploy/ci/scan-gate.sh --check-ignorefile enforces both in job config). grype reads no date: remove or renew the
# rule with its entry. A rule's package name is a regex: every metacharacter escaped with \.

# Empty: every entry of .trivyignore.yaml is for a dev dependency of pnpm-lock.yaml that never reaches the image.
# Design notes: README.md.
ignore: []
