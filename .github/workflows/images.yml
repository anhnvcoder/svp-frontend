# The web image of this repository, ghcr.io/anhnvcoder/svp-frontend/web: built at every run from the whole tree, on native
# amd64 and arm64 runners; the local image scanned with trivy, and its SBOM with grype, blocking secrets and CRITICAL
# vulnerabilities BEFORE anything is pushed; exactly what was scanned pushed; a multi-arch index joined, signed keyless
# with cosign, and attested with the SBOM (syft), the scan result and the build provenance; the signed digest promoted
# to stg through a pull request in the deployment repository svp-gitops; released digests rescanned daily.
#
# The logic is the backend's deploy/ci/*.sh, run from .backend/, the backend checked out at the commit of
# .backend-commit (make backend-checkout), the one place this repository pins it. SVP_CODE_ROOT (below) tells those
# scripts that the code built and released is this checkout, not the backend's: they take the release source whose
# repository is this one (deploy/helm/svp-policy/files/sources.json of .backend/), push under its prefix, sign with its
# identity, and refuse to run when HEAD here is not the commit of the run. Job promote is the exception: its step,
# here, writes the image block of web in svp-gitops and opens the pull request with gh, with three helpers of the
# backend's deploy/ci/common.sh (yq_, the yq the backend's Makefile pins by digest; promote_open_pr; promote_image_row,
# the row of the pull request's table). This file wires jobs, permissions and artifacts.
#
# Security rules of this file:
#   - permissions: {} here, and each job declares only what it needs. Every job that runs on a pull request has only
#     contents: read: a pull request runs its own code (and the scripts of the backend commit it pins) before anyone
#     has read them. Jobs that can write (packages, id-token, security-events) run only on main, outside pull_request.
#   - Only job promote writes to another repository: environment promote (deployment branch main only) holds the key
#     of the GitHub App svp-web-promoter, installed on svp-gitops alone, and the job turns it into a token of one hour
#     for svp-gitops with contents and pull-requests write only, revoked when the job ends. No job of a pull request
#     names that environment or reads a secret.
#   - Every action is pinned to a full commit SHA (the tag in the comment is for people and Renovate); only GitHub's
#     own actions and sigstore/cosign-installer.
#   - Untrusted values (inputs, branch names, matrix values from plan) reach scripts through env:, never ${{ }} inside
#     run:.
#   - actions/checkout never keeps the token in .git/config: no job pushes to this repository.
name: images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily rescan, off the top of the hour (busy for GitHub's scheduler) and not at the backend's minute. Kyverno
    # accepts an attestation for 72 hours, so two missed days are still fine.
    - cron: "47 1 * * *"
  workflow_dispatch:
    inputs:
      services:
        description: "Build again at this commit: 'all' or 'web' (this repository releases web only)"
        type: string
        default: ""
      rescan:
        description: "Rescan the released web digests now and replace their vuln attestations"
        type: boolean
        default: false

permissions: {}

# Every script of .backend/ reads the code it builds, labels and releases from here.
env:
  SVP_CODE_ROOT: ${{ github.workspace }}

# One group per ref and mode: the scheduled rescan also runs on refs/heads/main, and sharing the build's group would
# let it replace a queued push run. A run on main is never cancelled: cancelling one half-way through signing would
# leave a pushed digest without its signature. Runs on main follow each other, so a later run never promotes before
# an earlier one, and job promote never moves stg back to an older commit either way.
concurrency:
  group: images-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.rescan) && 'rescan' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # What this run does (deploy/ci/plan.sh): mode (build or rescan), images, matrix of legs. In this tree every build
    # builds web, with no base to compare with: the whole tree is its code. Every job after it starts its if: with a
    # status function (!cancelled() && ...): an if: without one gets an implicit success(), false once a job up the
    # needs chain was skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      images: ${{ steps.plan.outputs.images }}
      legs: ${{ steps.plan.outputs.legs }}
      has_images: ${{ steps.plan.outputs.has_images }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend at .backend-commit, anonymously over HTTPS: no token, no secret.
      - &backend
        run: make backend-checkout
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
        run: .backend/deploy/ci/plan.sh

  build-nopush:
    # Pull requests and refs other than main: build, scan and gate exactly like main, push nothing.
    # Findings go to the job summary only (no Security tab upload from a pull request).
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - *checkout
      - *backend
      - &day
        id: day
        run: echo "day=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - &trivy-cache
        # The trivy DB, one cache entry per day (trivy's advice against download limits); trivy still downloads a newer
        # DB when the cached one is stale. A pull request's cache stays in its own ref and never replaces main's.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - &grype-cache
        # The grype DB, the same way: one entry per day (about 480 MB as a cache entry, of the repository's 10 GB
        # quota). grype checks for a newer DB on every scan that has not checked in the last two hours, and refuses
        # one built more than five days ago.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grype-cache
          key: grype-db-${{ steps.day.outputs.day }}
          restore-keys: grype-db-
      - &build-scan-gate
        name: Build, scan and gate
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
          SVP_GRYPE_CACHE: ${{ runner.temp }}/grype-cache
        run: .backend/deploy/ci/build-image.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/leg"

  build:
    # main: the same steps, then push exactly the scanned image (by config digest) and hand the leg to the jobs after
    # it as an artifact. The gate step has no always() and no continue-on-error: a blocked image stops the leg before
    # the push. The cache is the only shared state, and no job holding id-token uses it.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - *checkout
      - *backend
      - *day
      - *trivy-cache
      - *grype-cache
      - *build-scan-gate
      - name: Push the scanned image, compare its config digest
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          .backend/deploy/ci/push-image.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/leg"
      - name: Hand the leg over (manifest digest, scan report, SBOM, scan times)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/leg/platform
            ${{ runner.temp }}/leg/repository
            ${{ runner.temp }}/leg/digest
            ${{ runner.temp }}/leg/config-digest
            ${{ runner.temp }}/leg/trivy.json
            ${{ runner.temp }}/leg/sbom.spdx.json
            ${{ runner.temp }}/leg/scan-started
            ${{ runner.temp }}/leg/scan-finished
            ${{ runner.temp }}/leg/db-updated-at
          if-no-files-found: error
          retention-days: 7
      - name: Keep the SARIF for the Security tab, blocked or not
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/leg/trivy.sarif
            ${{ runner.temp }}/leg/grype.sarif
          if-no-files-found: ignore
          retention-days: 7

  merge:
    # One index per image from its two scanned manifests. An image with a failed leg has no two artifacts and fails
    # here: no index, no signature, no release.
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - *checkout
      - *backend
      - &download-legs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: leg-${{ matrix.image }}-*
          path: ${{ runner.temp }}/legs
      - name: Join the two manifests into one index
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" ] || [ ! -d "$RUNNER_TEMP/legs/leg-$IMAGE-arm64" ]; then
            echo "::error::$IMAGE: a leg did not pass (see the build job); no index, no signature, no release"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          .backend/deploy/ci/merge-index.sh "$IMAGE" "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" \
            "$RUNNER_TEMP/legs/leg-$IMAGE-arm64" "$RUNNER_TEMP/index"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/index/repository
            ${{ runner.temp }}/index/tag
            ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 7

  sign:
    # Keyless signature on the index digest, SBOM attestation on each manifest, vuln attestation (both scans) and build
    # provenance (SLSA v1: workflow, ref, commit and attempt of this run, read from the run's own context) on the index.
    # sign-image.sh refuses to sign unless the run's workflow is the subject of this repository's release source
    # (images.yml on refs/heads/main), the identity Kyverno admits for web from here. The only build-path job with
    # id-token: write; it uses no cache. Its artifact release-<image> (repository, tag, digest of the signed index) is
    # what promote writes to envs/stg/images/ of svp-gitops.
    needs: [plan, merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - *checkout
      - *backend
      - *download-legs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index
      - &cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and attest
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          .backend/deploy/ci/sign-image.sh "$RUNNER_TEMP/index" \
            "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" "$RUNNER_TEMP/legs/leg-$IMAGE-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/index/repository
            ${{ runner.temp }}/index/tag
            ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 7

  promote:
    # Promotes web to stg in svp-gitops: rebuilds its branch bot/promote-stg-web as one commit of the app's bot on top
    # of main there, with the image block of envs/stg/images/web.yaml set to the release this run signed (the file's
    # comments kept), opens or updates its pull request and turns on auto-merge; svp-gitops merges it once its check
    # gitops-ok is green, with no review (no code owner owns envs/stg/). Never writes envs/stg/charts.yaml: the charts
    # are the backend's. Runs when signing failed too, and then promotes nothing. Runs of main follow each other (the
    # concurrency group of builds never cancels), so a later run never promotes before an earlier one; the step
    # refuses a run whose commit is older than the release of web that main of svp-gitops or the open pull request
    # names (a run started again, a dispatch of an old commit), commits compared by ancestry, never by time. The token
    # is the app's, for svp-gitops alone; GITHUB_TOKEN only reads this repository. No id-token, no packages.
    needs: [plan, sign]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the step compares this commit with stg's release by ancestry.
          fetch-depth: 0
          persist-credentials: false
      - *backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/releases
      - id: app
        # Revoked when the job ends. Only the repository svp-gitops and only the two permissions the pull request needs.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_WEB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_WEB_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Rebuild bot/promote-stg-web in svp-gitops, open or update its pull request, turn on auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # yq_ (the yq of YQ_IMAGE, pinned by digest in the backend's Makefile, run without network: the yq
          # preinstalled on the runner changes with the runner image, unseen, and this step writes the deployment
          # repository), promote_open_pr (the open pull request of the app from a branch, never a fork's; a gh that
          # fails, or a list too long to trust, fails) and promote_image_row (the row of the table in the pull
          # request's body). Sourcing it only defines things.
          . .backend/deploy/ci/common.sh
          # After the source: its own fail would print no annotation.
          fail() { echo "::error::$*" >&2; exit 1; }
          # not_behind WHERE: fails when this run's commit is a proper ancestor of the commit of the release of web that
          # the image file at WHERE names (a ref of svp-gitops): promoting it would take stg back. A file naming
          # another repository, or a tag that is no commit of this clone, cannot be compared and is not guessed.
          not_behind() {
            local r t c
            if ! r=$(git show "$1:$file" | yq_ -e .image.repository) || ! t=$(git show "$1:$file" | yq_ -e .image.tag); then
              fail "$file at $1 of svp-gitops has no image.repository and image.tag"
            fi
            [ "$r" = "$image" ] || fail "$file at $1 of svp-gitops names $r, not $image: not guessing whose it is"
            if ! [[ $t =~ ^[0-9a-f]{12}$ ]] || ! c=$(git -C "$code" rev-parse --verify --quiet "$t^{commit}"); then
              fail "tag '$t' of $file at $1 of svp-gitops is no commit of this repository"
            fi
            [ "$RUN_COMMIT" = "$c" ] || ! git -C "$code" merge-base --is-ancestor "$RUN_COMMIT" "$c" ||
              fail "this run's commit ${RUN_COMMIT:0:12} is older than $t, which $1 of svp-gitops names: promoting it would take stg back"
          }
          code=$PWD repo=anhnvcoder/svp-gitops branch=bot/promote-stg-web app=svp-web-promoter
          file=envs/stg/images/web.yaml image=ghcr.io/anhnvcoder/svp-frontend/web
          # The release this run signed: none when signing failed (no artifact, not even the directory), never more
          # than one.
          found=$(find "$RUNNER_TEMP/releases" -type f -name digest 2>/dev/null | sort) || found=
          if [ -z "$found" ]; then
            echo "No release was signed in this run: nothing to promote."
            exit 0
          fi
          [[ $found != *$'\n'* ]] || fail "more than one release in this run: ${found//$'\n'/ }"
          dir=$(dirname "$found") R=$(cat "$dir/repository") T=$(cat "$dir/tag") D=$(cat "$dir/digest")
          if [ "$R" != "$image" ] || [ "$T" != "${RUN_COMMIT:0:12}" ] || ! [[ $D =~ ^sha256:[0-9a-f]{64}$ ]]; then
            fail "$dir is no release of web at this commit ($R:$T@$D)"
          fi
          # Cloned anonymously: the token reaches only gh and, through gh's credential helper, the push.
          git -c credential.helper= clone --quiet --no-tags "https://github.com/$repo.git" "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$branch") || lease=
          pr=$(promote_open_pr "$repo" "$branch" "$app")
          not_behind origin/main
          if [ -n "$lease" ] && [ -n "$pr" ]; then not_behind "$lease"; fi
          git checkout --quiet -B "$branch" origin/main
          yq_ R="$R" T="$T" D="$D" -i \
            '.image.repository = strenv(R) | .image.tag = strenv(T) | .image.digest = strenv(D)' "$file"
          if git diff --quiet origin/main; then
            echo "main of svp-gitops already runs $R:$T@$D: no push, no pull request."
            exit 0
          fi
          title="chore(stg): phát hành web ở $T"
          code_url=https://github.com/$GITHUB_REPOSITORY/commit/$RUN_COMMIT
          msg="- web: $R:$T@$D

          Code: $code_url
          Run: $RUN_URL"
          row=$(promote_image_row web "$R" "$T" "$D")
          body="## Thay đổi gì

          Đưa web lên stg bằng image mới.

          | Service | Commit | Image |
          | --- | --- | --- |
          $row

          Digest đầy đủ nằm trong commit của PR.

          ## Vì sao

          Commit [\`${RUN_COMMIT:0:12}\`]($code_url) vào \`main\` của \`$GITHUB_REPOSITORY\` đã build và ký image web, nên stg cần chạy bản đó.

          ## Đã kiểm gì

          - [Lượt CI]($RUN_URL) đã build và ký image trên.
          - Check \`gitops-ok\` của \`svp-gitops\` chạy trên PR này: image ghim digest, có chữ ký, kết quả quét lỗ hổng còn hạn
            và provenance khớp commit.
          - PR tự merge (squash) khi \`gitops-ok\` xanh. \`envs/stg/\` không có Code Owner nên không cần ai duyệt.

          ## Phạm vi

          Bot \`$app\` chỉ sửa khối \`image\` của \`$file\`. Nó không sửa \`envs/stg/charts.yaml\`: chart thuộc repo backend.
          Mỗi lượt build dựng lại nhánh \`$branch\` từ \`main\` và ghi đè \`$file\` bằng bản của lượt đó; bản chưa merge của lượt trước bị thay."
          id=$(gh api "users/${app}%5Bbot%5D" --jq .id)
          git -c user.name="${app}[bot]" -c user.email="$id+${app}[bot]@users.noreply.github.com" \
            commit --quiet -am "$title" -m "$msg"
          # The lease is the branch as cloned (empty: it must not exist): a change since fails the push, never lost.
          gh auth setup-git
          git push --quiet --force-with-lease="refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          # Read again after the push: the pull request read before, merged or closed meanwhile, no longer holds the
          # branch, and editing it would still succeed.
          now=$(promote_open_pr "$repo" "$branch" "$app")
          [ -z "$pr" ] || [ "$now" = "$pr" ] ||
            fail "pull request #$pr of $branch was merged or closed during this run: run the job again (from main as is)"
          if [ -n "$now" ]; then
            gh pr edit "$now" --repo "$repo" --title "$title" --body "$body"
          else
            now=$(gh pr create --repo "$repo" --base main --head "$branch" --title "$title" --body "$body")
            now=${now##*/}
          fi
          gh pr merge "$now" --repo "$repo" --auto --squash --match-head-commit "$(git rev-parse HEAD)"

  rescan:
    # Daily (and on dispatch rescan=true): every web digest of this repository that svp-gitops names (envs/*/images/ at
    # its main and at the open pull request bot/promote-stg-web) is scanned again, manifest by manifest, and its vuln
    # attestation replaced with the real result, signed with this workflow's identity; a CRITICAL is recorded first,
    # then fails the job, which mails the owner; a secret fails the job before anything is attested
    # (deploy/ci/rescan.sh). Releases of the backend are left to the backend's own rescan: --source web makes the script
    # check that this run is of this repository's release source and its signing workflow before it reads anything, so
    # it never replaces an attestation of another repository's release. svp-gitops is cloned anonymously and its files
    # read as data, never run; GITHUB_TOKEN only asks whether the promote pull request is open (a read of a public
    # repository). No cache: the job holds id-token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'rescan'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.backend/.gitops/svp-gitops
    steps:
      - *checkout
      - *backend
      - *cosign
      - run: make -C .backend gitops-clone
      - name: Rescan and attest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          .backend/deploy/ci/rescan.sh run --source web "$RUNNER_TEMP/rescan" "$SVP_GITOPS_DIR"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-rescan
          path: ${{ runner.temp }}/rescan/sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7

  sarif:
    # Uploads the SARIF of main's builds and rescans to the Security tab, one upload per tool (upload-sarif merges the
    # files it is given into one log, and GitHub rejects a log with more than 20 runs). The only job with
    # security-events: write; it runs no code of the repository. A report, not a check: not in images-ok (a failed
    # upload still turns the run red).
    needs: [plan, build, rescan]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.plan.outputs.mode == 'rescan'
      || (needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif
      - id: split
        # Sorts the files into one directory per tool and counts the runs with the runner's jq, so that a log over the
        # limit stops here with its count instead of GitHub's rejection. A tool over the limit is not uploaded; the
        # other one still is.
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-trivy" "$RUNNER_TEMP/sarif-grype"
          while IFS= read -r -d '' f; do
            # download-artifact unpacks a lone artifact straight into the path, with no folder of its name: a
            # rescan uploads only sarif-rescan, so its files land directly in sarif/ and are trivy's.
            case "$f" in
              */grype.sarif) tool=grype ;;
              */trivy.sarif | */sarif-rescan/*.sarif | "$RUNNER_TEMP"/sarif/*-*.sarif) tool=trivy ;;
              *)
                echo "::error::Unexpected SARIF file ${f#"$RUNNER_TEMP"/}"
                exit 1
                ;;
            esac
            dir=${f%/*}
            cp "$f" "$RUNNER_TEMP/sarif-$tool/${dir##*/}-${f##*/}"
          done < <(find "$RUNNER_TEMP/sarif" -name '*.sarif' -print0 2>/dev/null)
          over=0
          for tool in trivy grype; do
            files=("$RUNNER_TEMP/sarif-$tool"/*.sarif)
            if [ ! -e "${files[0]}" ]; then
              echo "No $tool SARIF to upload (no leg reached its scan)."
              continue
            fi
            runs=$(jq -s 'map(.runs | length) | add' "${files[@]}")
            if [ "$runs" -gt 20 ]; then
              echo "::error::$runs $tool SARIF runs in ${#files[@]} files: GitHub rejects an upload with more than 20 runs"
              over=1
              continue
            fi
            echo "$tool: $runs SARIF runs in ${#files[@]} files"
            echo "$tool=true" >>"$GITHUB_OUTPUT"
          done
          exit "$over"
      - name: Upload the trivy SARIF
        if: ${{ !cancelled() && steps.split.outputs.trivy == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/sarif-trivy
      - name: Upload the grype SARIF
        if: ${{ !cancelled() && steps.split.outputs.grype == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/sarif-grype

  images-ok:
    # The required check of this workflow. Green only when every job succeeded or was skipped for a reason this job
    # recomputes from the event, the ref and plan's outputs: a skip from a wrong if: is red, and so are failure and
    # cancelled. Never skipped itself (GitHub counts a skipped required check as passed). Needs no permission and runs
    # no code of the repository.
    needs:
      - plan
      - build-nopush
      - build
      - merge
      - sign
      - promote
      - rescan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ needs.plan.outputs.mode }}
          HAS_IMAGES: ${{ needs.plan.outputs.has_images }}
        run: |
          main=false
          [ "$REF" = refs/heads/main ] && [ "$EVENT" != pull_request ] && main=true
          # skip_ok JOB: true when this run is one in which JOB does not run.
          skip_ok() {
            case $1 in
            build-nopush) [ "$main" = true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            build | merge | sign | promote) [ "$main" != true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            rescan) [ "$MODE" != rescan ] ;;
            *) false ;;
            esac
          }
          red=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case $result in
            success) echo "ok    $job" ;;
            skipped)
              if skip_ok "$job"; then
                echo "ok    $job skipped: not part of this run"
              else
                echo "::error::$job was skipped, but this run needed it"
                red=1
              fi
              ;;
            *)
              echo "::error::$job: $result"
              red=1
              ;;
            esac
          done
          exit "$red"
