# The web image of this repository: built, scanned and gated BEFORE anything is pushed, pushed as scanned, signed and
# attested keyless, copied with its bundles to ECR stg, promoted to stg through a pull request in svp-gitops, rescanned
# daily. Build, scan, join and sign are the backend's composite actions (./.backend/.github/actions/<name>, pinned by
# .backend-commit); their steps run in the calling job, so the signature and provenance name this workflow. Public
# repository: no pull_request_target or workflow_run; permissions: {}, each job its own, pull request jobs only
# contents: read; write jobs and AWS roles (OIDC: release by main, rescan by environment ecr-rescan) only on main;
# actions pinned to a full commit SHA, checkout without a persisted token; untrusted values reach scripts via env: only.
# Design notes: README.md.
name: images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Off the hour (busy for GitHub's scheduler) and not at the backend's minute; Kyverno accepts an attestation for 72
    # hours, so two missed days are still fine.
    - cron: "47 1 * * *"
  workflow_dispatch:
    inputs:
      services:
        description: "Build again at this commit: 'all' or 'web' (this repository releases web only)"
        type: string
        default: ""
      rescan:
        description: "Rescan the released web digests now and replace their vuln attestations"
        type: boolean
        default: false
      values_ref:
        description: "With rescan: also the web digests svp-gitops names at this branch, SHA or refs/pull/<n>/head (a rollback)"
        type: string
        default: ""
      digest:
        description: "With rescan and image: rescan only this release, which no svp-gitops ref names under envs/<env>/ yet, and refresh it in the ECR of env"
        type: string
        default: ""
      image:
        description: "With digest: the image of this repository whose release it is (web)"
        type: string
        default: ""
      env:
        description: "With digest: the environment whose ECR holds the release (stg: also copy what it misses there)"
        type: choice
        options: [stg, prd]
        default: stg

permissions: {}

# Every script of .backend/ reads the code it builds, labels and releases from here; the actions get it as code-root.
env:
  SVP_CODE_ROOT: ${{ github.workspace }}

# One group per ref and mode: the scheduled rescan also runs on refs/heads/main, and sharing the build's group would
# let it replace a queued push run. A run on main is never cancelled: cancelling one half-way through signing would
# leave a pushed digest without its signature.
concurrency:
  group: images-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.rescan) && 'rescan' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # What this run does (deploy/ci/plan.sh): mode (build or rescan), images, matrix of legs; every build builds web.
    # Every job after it starts its if: with !cancelled() &&: an if: without a status function gets an implicit
    # success(), false once a job up the needs chain was skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      images: ${{ steps.plan.outputs.images }}
      legs: ${{ steps.plan.outputs.legs }}
      has_images: ${{ steps.plan.outputs.has_images }}
      values_ref: ${{ steps.plan.outputs.values_ref }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend at .backend-commit, anonymously over HTTPS: no token, no secret.
      - &backend
        run: make backend-checkout
      - name: digest, image and env go with rescan only
        env:
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
          INPUT_DIGEST: ${{ inputs.digest }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_ENV: ${{ inputs.env }}
        run: |
          if [ -n "$INPUT_DIGEST$INPUT_IMAGE" ] || [ "${INPUT_ENV:-stg}" != stg ]; then
            if [ "$INPUT_RESCAN" != true ] || [ -z "$INPUT_DIGEST" ] || [ -z "$INPUT_IMAGE" ] || [ -n "$INPUT_VALUES_REF" ]; then
              echo "::error::digest, image and env rescan one release: dispatch them with rescan=true, both digest and image, no values_ref"
              exit 1
            fi
          fi
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
        run: .backend/deploy/ci/plan.sh

  build-nopush:
    # Pull requests and refs other than main: build, scan and gate exactly like main, push nothing.
    # Findings go to the job summary only (no Security tab upload from a pull request).
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - *checkout
      - *backend
      # The trivy and grype DBs are cached inside the action, one entry per day; a pull request's cache stays in its
      # own ref and never replaces main's.
      - uses: ./.backend/.github/actions/image-leg
        with:
          image: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          push: "false"
          code-root: ${{ github.workspace }}
          out: ${{ runner.temp }}/leg

  build:
    # main: the same build, scan and gate, then push exactly the scanned image (by config digest) and hand the leg on as
    # artifacts. A blocked image stops the leg before the push. The trivy and grype DB caches are the only shared state,
    # and no job holding id-token uses them.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - *checkout
      - *backend
      - uses: ./.backend/.github/actions/image-leg
        with:
          image: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          push: "true"
          code-root: ${{ github.workspace }}
          out: ${{ runner.temp }}/leg

  merge:
    # An image with a failed leg has no two artifacts and fails here: no index, no signature, no release.
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - *checkout
      - *backend
      - uses: ./.backend/.github/actions/image-index
        with:
          image: ${{ matrix.image }}
          code-root: ${{ github.workspace }}
          out: ${{ runner.temp }}/merge

  sign:
    # The action refuses to sign unless the run's workflow is the subject of this repository's release source
    # (images.yml on refs/heads/main), the identity Kyverno admits for web from here, and writes a bundle only when the
    # digest has none of its type (a run started again signs nothing twice). The only build-path job with
    # attestations: write; id-token: write here and in ecr-copy; it uses no cache.
    needs: [plan, merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - *checkout
      - *backend
      - uses: ./.backend/.github/actions/image-sign
        with:
          image: ${{ matrix.image }}
          code-root: ${{ github.workspace }}
          out: ${{ runner.temp }}/sign

  ecr-copy:
    # Copies the signed release, same digest, with its signature and attestations to ECR stg and verifies it there;
    # only then uploads ecr-<image>, what promote releases. id-token: write for the AWS release role (subject: main);
    # no GitHub write, no cache. A missing account ID secret fails here, naming it.
    needs: [plan, sign]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - *checkout
      - *backend
      - name: Secret SVP_AWS_STG_ACCOUNT_ID is set
        env:
          ACCOUNT: ${{ secrets.SVP_AWS_STG_ACCOUNT_ID }}
        run: |
          [ -n "$ACCOUNT" ] || {
            echo "::error::Secret SVP_AWS_STG_ACCOUNT_ID is not set: nothing is copied to ECR stg, nothing promoted"
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.SVP_AWS_STG_ACCOUNT_ID }}:role/svp-ci-ecr-release-frontend
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
          mask-aws-account-id: true
          aws-profile: svp-stg
      # ecr-copy.sh verifies with the cosign on PATH.
      - &cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.image }}
          path: ${{ runner.temp }}/release
      - name: Copy to ECR stg and verify there
        env:
          AWS_PROFILE: svp-stg
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          REGISTRY: ${{ secrets.SVP_AWS_STG_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
          RELEASE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin "$REGISTRY"
          .backend/deploy/ci/ecr-copy.sh copy "$(cat "$RELEASE/repository")" "$(cat "$RELEASE/digest")" "$REGISTRY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecr-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/release/repository
            ${{ runner.temp }}/release/tag
            ${{ runner.temp }}/release/digest
          if-no-files-found: error
          retention-days: 7

  promote:
    # Promotes web, copied to ECR stg and verified there, to stg in svp-gitops: a bot commit on bot/promote-stg-web, a
    # pull request with auto-merge once gitops-ok is green (no code owner owns envs/stg/); never envs/stg/charts.yaml.
    # Environment promote (main only) holds the key of the App on svp-gitops alone, a one-hour token; no pull request
    # job names it. The step refuses a run older than the release stg names (by ancestry), so stg never moves back.
    needs: [plan, ecr-copy]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the step compares this commit with stg's release by ancestry.
          fetch-depth: 0
          persist-credentials: false
      - *backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ecr-*
          path: ${{ runner.temp }}/releases
      - id: app
        # Revoked when the job ends. Only the repository svp-gitops and only the two permissions the pull request needs.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_WEB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_WEB_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Rebuild bot/promote-stg-web in svp-gitops, open or update its pull request, turn on auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # yq_ runs the yq of YQ_IMAGE (digest-pinned in the backend's Makefile) without network: the runner's own yq
          # changes unseen with the runner image, and this step writes the deployment repository. Also promote_open_pr
          # and promote_image_row (the row of the pull request's table). Sourcing it only defines things.
          . .backend/deploy/ci/common.sh
          # After the source: its own fail would print no annotation.
          fail() { echo "::error::$*" >&2; exit 1; }
          # not_behind WHERE: fails when this run's commit is a proper ancestor of the commit of the release of web that
          # the image file at WHERE names (a ref of svp-gitops): promoting it would take stg back. A file naming
          # another repository, or a tag that is no commit of this clone, cannot be compared and is not guessed.
          not_behind() {
            local r t c
            if ! r=$(git show "$1:$file" | yq_ -e .image.repository) || ! t=$(git show "$1:$file" | yq_ -e .image.tag); then
              fail "$file at $1 of svp-gitops has no image.repository and image.tag"
            fi
            [ "$r" = "$image" ] || fail "$file at $1 of svp-gitops names $r, not $image: not guessing whose it is"
            if ! [[ $t =~ ^[0-9a-f]{12}$ ]] || ! c=$(git -C "$code" rev-parse --verify --quiet "$t^{commit}"); then
              fail "tag '$t' of $file at $1 of svp-gitops is no commit of this repository"
            fi
            [ "$RUN_COMMIT" = "$c" ] || ! git -C "$code" merge-base --is-ancestor "$RUN_COMMIT" "$c" ||
              fail "this run's commit ${RUN_COMMIT:0:12} is older than $t, which $1 of svp-gitops names: promoting it would take stg back"
          }
          code=$PWD repo=anhnvcoder/svp-gitops branch=bot/promote-stg-web app=svp-web-promoter
          file=envs/stg/images/web.yaml image=ghcr.io/anhnvcoder/svp-frontend/web
          # The release this run signed and verified in ECR stg: none when signing or the copy failed (no artifact,
          # not even the directory), never more than one.
          found=$(find "$RUNNER_TEMP/releases" -type f -name digest 2>/dev/null | sort) || found=
          if [ -z "$found" ]; then
            echo "No release was signed and copied to ECR stg in this run: nothing to promote."
            exit 0
          fi
          [[ $found != *$'\n'* ]] || fail "more than one release in this run: ${found//$'\n'/ }"
          dir=$(dirname "$found") R=$(cat "$dir/repository") T=$(cat "$dir/tag") D=$(cat "$dir/digest")
          if [ "$R" != "$image" ] || [ "$T" != "${RUN_COMMIT:0:12}" ] || ! [[ $D =~ ^sha256:[0-9a-f]{64}$ ]]; then
            fail "$dir is no release of web at this commit ($R:$T@$D)"
          fi
          # Cloned anonymously: the token reaches only gh and, through gh's credential helper, the push.
          git -c credential.helper= clone --quiet --no-tags "https://github.com/$repo.git" "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$branch") || lease=
          pr=$(promote_open_pr "$repo" "$branch" "$app")
          not_behind origin/main
          if [ -n "$lease" ] && [ -n "$pr" ]; then not_behind "$lease"; fi
          git checkout --quiet -B "$branch" origin/main
          yq_ R="$R" T="$T" D="$D" -i \
            '.image.repository = strenv(R) | .image.tag = strenv(T) | .image.digest = strenv(D)' "$file"
          if git diff --quiet origin/main; then
            echo "main of svp-gitops already runs $R:$T@$D: no push, no pull request."
            exit 0
          fi
          title="chore(stg): phát hành web ở $T"
          code_url=https://github.com/$GITHUB_REPOSITORY/commit/$RUN_COMMIT
          msg="- web: $R:$T@$D

          Code: $code_url
          Run: $RUN_URL"
          row=$(promote_image_row web "$R" "$T" "$D")
          body="## Thay đổi gì

          Đưa web lên stg bằng image mới.

          | Service | Commit | Image |
          | --- | --- | --- |
          $row

          Digest đầy đủ nằm trong commit của PR.

          ## Vì sao

          Commit [\`${RUN_COMMIT:0:12}\`]($code_url) vào \`main\` của \`$GITHUB_REPOSITORY\` đã build và ký image web, nên stg cần chạy bản đó.

          ## Đã kiểm gì

          - [Lượt CI]($RUN_URL) đã build và ký image trên, rồi chép nó cùng chữ ký, attestation sang ECR stg và kiểm lại ở đó.
          - Check \`gitops-ok\` của \`svp-gitops\` chạy trên PR này: image ghim digest, có chữ ký, kết quả quét lỗ hổng còn hạn
            và provenance khớp commit.
          - PR tự merge (squash) khi \`gitops-ok\` xanh. \`envs/stg/\` không có Code Owner nên không cần ai duyệt.

          ## Phạm vi

          Bot \`$app\` chỉ sửa khối \`image\` của \`$file\`. Nó không sửa \`envs/stg/charts.yaml\`: chart thuộc repo backend.
          Mỗi lượt build dựng lại nhánh \`$branch\` từ \`main\` và ghi đè \`$file\` bằng bản của lượt đó; bản chưa merge của lượt trước bị thay."
          id=$(gh api "users/${app}%5Bbot%5D" --jq .id)
          git -c user.name="${app}[bot]" -c user.email="$id+${app}[bot]@users.noreply.github.com" \
            commit --quiet -am "$title" -m "$msg"
          # The lease is the branch as cloned (empty: it must not exist): a change since fails the push, never lost.
          gh auth setup-git
          git push --quiet --force-with-lease="refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          # Read again after the push: the pull request read before, merged or closed meanwhile, no longer holds the
          # branch, and editing it would still succeed.
          now=$(promote_open_pr "$repo" "$branch" "$app")
          [ -z "$pr" ] || [ "$now" = "$pr" ] ||
            fail "pull request #$pr of $branch was merged or closed during this run: run the job again (from main as is)"
          if [ -n "$now" ]; then
            gh pr edit "$now" --repo "$repo" --title "$title" --body "$body"
          else
            now=$(gh pr create --repo "$repo" --base main --head "$branch" --title "$title" --body "$body")
            now=${now##*/}
          fi
          gh pr merge "$now" --repo "$repo" --auto --squash --match-head-commit "$(git rev-parse HEAD)"

  rescan:
    # Every web digest svp-gitops names is scanned again per manifest, its vuln attestation replaced, then in the ECR of
    # each env naming it (that account's rescan role, environment ecr-rescan); a CRITICAL is recorded, then fails the
    # job; a secret fails it before anything is attested. --source web: rescan.sh first checks this run is of this
    # repository's release source, never replacing another's attestation. svp-gitops is data, never run. No cache.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'rescan'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ecr-rescan
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.backend/.gitops/svp-gitops
    steps:
      - *checkout
      - *backend
      - name: Secrets SVP_AWS_STG_ACCOUNT_ID and SVP_AWS_PRD_ACCOUNT_ID are set
        env:
          STG: ${{ secrets.SVP_AWS_STG_ACCOUNT_ID }}
          PRD: ${{ secrets.SVP_AWS_PRD_ACCOUNT_ID }}
        run: |
          [ -n "$STG" ] || echo "::error::Secret SVP_AWS_STG_ACCOUNT_ID is not set: ECR stg cannot be refreshed"
          [ -n "$PRD" ] || echo "::error::Secret SVP_AWS_PRD_ACCOUNT_ID is not set: ECR prd cannot be refreshed"
          [ -n "$STG" ] && [ -n "$PRD" ]
      # Two accounts in one job: each role as its own AWS profile, picked per ECR by rescan.sh.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.SVP_AWS_STG_ACCOUNT_ID }}:role/svp-ci-ecr-rescan-frontend
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
          mask-aws-account-id: true
          aws-profile: svp-stg
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.SVP_AWS_PRD_ACCOUNT_ID }}:role/svp-ci-ecr-rescan-frontend
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
          mask-aws-account-id: true
          aws-profile: svp-prd
      # rescan.sh and ecr-copy.sh run the cosign on PATH.
      - *cosign
      - run: make -C .backend gitops-clone
      - name: Rescan and attest, then refresh the copies in ECR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VALUES_REF: ${{ needs.plan.outputs.values_ref }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          SVP_ECR_REGISTRY_STG: ${{ secrets.SVP_AWS_STG_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
          SVP_ECR_REGISTRY_PRD: ${{ secrets.SVP_AWS_PRD_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
          DIGEST: ${{ inputs.digest }}
          IMAGE: ${{ inputs.image }}
          RESCAN_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for e in stg prd; do
            registry=SVP_ECR_REGISTRY_${e^^}
            aws ecr get-login-password --profile "svp-$e" --region ap-southeast-1 |
              docker login --username AWS --password-stdin "${!registry}"
          done
          if [ -n "$DIGEST" ]; then
            .backend/deploy/ci/rescan.sh run-digest --source web "$RUNNER_TEMP/rescan" "$IMAGE" "$DIGEST" "$RESCAN_ENV"
          else
            .backend/deploy/ci/rescan.sh run --source web "$RUNNER_TEMP/rescan" "$SVP_GITOPS_DIR" "$VALUES_REF"
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-rescan
          path: ${{ runner.temp }}/rescan/sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7

  sarif:
    # One upload per tool (upload-sarif merges the files it is given into one log, and GitHub rejects a log with more
    # than 20 runs). The only job with security-events: write; it runs no code of the repository. A report, not a
    # check: not in images-ok (a failed upload still turns the run red).
    needs: [plan, build, rescan]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.plan.outputs.mode == 'rescan'
      || (needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif
      - id: split
        # Per tool, counts the runs with the runner's jq: a log over the limit stops here with its count instead of
        # GitHub's rejection, and the other tool is still uploaded.
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-trivy" "$RUNNER_TEMP/sarif-grype"
          while IFS= read -r -d '' f; do
            # download-artifact unpacks a lone artifact straight into the path, with no folder of its name: a
            # rescan uploads only sarif-rescan, so its files land directly in sarif/ and are trivy's.
            case "$f" in
              */grype.sarif) tool=grype ;;
              */trivy.sarif | */sarif-rescan/*.sarif | "$RUNNER_TEMP"/sarif/*-*.sarif) tool=trivy ;;
              *)
                echo "::error::Unexpected SARIF file ${f#"$RUNNER_TEMP"/}"
                exit 1
                ;;
            esac
            dir=${f%/*}
            cp "$f" "$RUNNER_TEMP/sarif-$tool/${dir##*/}-${f##*/}"
          done < <(find "$RUNNER_TEMP/sarif" -name '*.sarif' -print0 2>/dev/null)
          over=0
          for tool in trivy grype; do
            files=("$RUNNER_TEMP/sarif-$tool"/*.sarif)
            if [ ! -e "${files[0]}" ]; then
              echo "No $tool SARIF to upload (no leg reached its scan)."
              continue
            fi
            runs=$(jq -s 'map(.runs | length) | add' "${files[@]}")
            if [ "$runs" -gt 20 ]; then
              echo "::error::$runs $tool SARIF runs in ${#files[@]} files: GitHub rejects an upload with more than 20 runs"
              over=1
              continue
            fi
            echo "$tool: $runs SARIF runs in ${#files[@]} files"
            echo "$tool=true" >>"$GITHUB_OUTPUT"
          done
          exit "$over"
      - name: Upload the trivy SARIF
        if: ${{ !cancelled() && steps.split.outputs.trivy == 'true' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/sarif-trivy
      - name: Upload the grype SARIF
        if: ${{ !cancelled() && steps.split.outputs.grype == 'true' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/sarif-grype

  images-ok:
    # The required check of this workflow. Green only when every job succeeded or was skipped for a reason this job
    # recomputes from the event, the ref and plan's outputs: a skip from a wrong if: is red. Never skipped itself
    # (GitHub counts a skipped required check as passed).
    needs:
      - plan
      - build-nopush
      - build
      - merge
      - sign
      - ecr-copy
      - promote
      - rescan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ needs.plan.outputs.mode }}
          HAS_IMAGES: ${{ needs.plan.outputs.has_images }}
        run: |
          main=false
          [ "$REF" = refs/heads/main ] && [ "$EVENT" != pull_request ] && main=true
          # skip_ok JOB: true when this run is one in which JOB does not run.
          skip_ok() {
            case $1 in
            build-nopush) [ "$main" = true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            build | merge | sign | ecr-copy | promote) [ "$main" != true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            rescan) [ "$MODE" != rescan ] ;;
            *) false ;;
            esac
          }
          red=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case $result in
            success) echo "ok    $job" ;;
            skipped)
              if skip_ok "$job"; then
                echo "ok    $job skipped: not part of this run"
              else
                echo "::error::$job was skipped, but this run needed it"
                red=1
              fi
              ;;
            *)
              echo "::error::$job: $result"
              red=1
              ;;
            esac
          done
          exit "$red"
