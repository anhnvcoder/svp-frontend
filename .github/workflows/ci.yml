# Checks of every pull request and push to main; ci-ok is the only check the ruleset requires.
# Scripts and tool versions shared with the backend come from .backend/, checked out at .backend-commit, the only pin.
# Public repository: a fork's pull request runs this file with its own code, so:
# - no pull_request_target or workflow_run: no write token or secret reaches a pull request;
# - jobs that run repository code get contents: read only; the one write job (sarif) runs on main and runs none of it;
# - actions pinned to a full commit SHA; checkout with persist-credentials: false;
# - untrusted values (branch names, titles) reach scripts through env:, never ${{ }}.
# Design notes: README.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # No paths filter on any trigger: a required check whose workflow never runs leaves the pull request waiting.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes its previous run useless. On main a running run is never cancelled, but the
  # group holds one running and one pending run: a newer push replaces the pending one, so with several merges during
  # one run the commits in between get no result of their own (the newest commit's run checks the code they led to).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a pull request changes, so a job whose area it leaves alone skips and ci-ok accepts that skip.
  # gitleaks, docs and dependency-review always run. A change of the Makefile, .backend-commit or this workflow, a push
  # and a dispatch turn every output true: when in doubt, run. The list comes from GitHub's API: no history is fetched.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      workflows: ${{ steps.files.outputs.workflows }}
      stack: ${{ steps.files.outputs.stack }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          docs='^docs/|^LICENSE$|\.md$'
          if [ "$EVENT" = pull_request ]; then
            # Both names of a renamed file. The API lists at most 3000 files of a pull request: a list shorter than the
            # pull request's count of changed files is incomplete, and then every job runs.
            listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
            count=$(printf '%s\n' "$listed" | grep -c . || true)
            if [ "$count" -eq "$CHANGED" ]; then
              files=$(printf '%s\n' "$listed" | tr '\t' '\n' | grep -v '^$' || true)
            else
              echo "::notice::the API listed $count of the $CHANGED changed files: every job runs"
              files=Makefile
            fi
          else
            files=Makefile
          fi
          printf '%s\n' "$files"
          # any REGEX [EXCLUDE]: true when a file matches REGEX and not EXCLUDE.
          any() {
            if printf '%s\n' "$files" | grep -E -- "$1" | grep -v -E -e "${2:-^$}" | grep -q .; then echo true; else echo false; fi
          }
          everything=$(any '^Makefile$|^\.backend-commit$|^\.github/workflows/ci\.yml$')
          {
            if [ "$everything" = true ]; then
              printf '%s=true\n' code workflows stack
            else
              echo "code=$(any '.' "$docs")"
              echo "workflows=$(any '^\.github/')"
              echo "stack=$(any '.' "$docs|^\.github/")"
            fi
          } | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # The BFF's session tests use Redis db 15 (default SVP_TEST_REDIS_URL of the Makefile), on loopback only.
      redis:
        image: docker.io/library/redis:8.8.3-trixie@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
        # The runner hands this string to docker create -p as it is, so the port is published on loopback only.
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache input: its pnpm cache needs pnpm on PATH before Node is there, so the store is cached below instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Node 25 and later ship no Corepack and the repository allows no third-party action (pnpm/action-setup), so pnpm
      # is installed with npm, at the version of packageManager in package.json (the one pin, Renovate updates it).
      - id: pnpm
        name: Install pnpm
        run: &install-pnpm |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The pnpm store, keyed on the lockfile. A pull request saves into its own scope only, never main's, so it cannot
      # plant a store that main later restores. pnpm checks the integrity hash of pnpm-lock.yaml only when it downloads
      # a tarball, not for packages already in a restored store.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The trivy DB of the lockfile scan below, one cache entry per day, restored before any step that can fail; trivy
      # still downloads a newer DB when the cached one is stale. A pull request's cache stays in its own ref and never
      # replaces main's.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - run: make install
      - run: make check
      # Verifies the released contract (digest, version, signature) anonymously, then compares; writes nothing in gen/.
      - run: make generate-check
      # Any CRITICAL in pnpm-lock.yaml (development dependencies included) fails the job; HIGH goes only to the SARIF.
      # Runs even when a step above failed, so a pull request always shows the gate's result.
      - name: make lockfile-scan
        if: ${{ !cancelled() }}
        env:
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: make lockfile-scan LOCKFILE_SARIF="$RUNNER_TEMP/trivy-lockfile.sarif"
      - name: Summary of the lockfile scan
        if: always()
        env:
          SARIF: ${{ runner.temp }}/trivy-lockfile.sarif
          TOOL: trivy lockfile
        run: &sarif-summary |
          # Rule, level and place of each finding (no message), at most 50 rows; nothing when the tool wrote no report.
          [ -f "$SARIF" ] || exit 0
          jq -r --arg tool "$TOOL" '[.runs[].results[]] as $r
            | "### \($tool): \($r | length) finding(s)", "",
              "| Level | Rule | Location |", "| --- | --- | --- |",
              ($r[:50][] | .locations[0].physicalLocation as $l
                | "| \(.level // "warning") | \(.ruleId) | \($l.artifactLocation.uri // "-"):\($l.region.startLine // "-") |")' \
            "$SARIF" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the lockfile scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-lockfile
          path: ${{ runner.temp }}/trivy-lockfile.sarif
          if-no-files-found: ignore

  config:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend at .backend-commit, anonymously over HTTPS: no token, no secret.
      - run: make backend-checkout
      # The only place an expired entry fails (grype reads no date, so its rule would go on covering the match); a
      # broken entry or rule merged into main would stop the image gate and the daily rescan of the web release.
      - name: Rules of .trivyignore.yaml and .grype.yaml
        run: SVP_CODE_ROOT="$PWD" .backend/deploy/ci/scan-gate.sh --check-ignorefile
      # Go only to build the two pinned tools below, at the Go of the backend's go.mod: no second pin.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .backend/go.mod
          cache: false
      # gitleaks and actionlint at the versions the backend's Makefile pins; rebuilt only when either Makefile changes.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: &tools-key tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', '.backend/Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools
      # Every workflow of .github/workflows/, with the runner's shellcheck on their run: scripts.
      - name: actionlint
        run: '"$(go env GOPATH)/bin/actionlint"'

  # gitleaks over the whole history of every ref (no --log-opts: setting it drops gitleaks's default --full-history
  # --all). --redact keeps the secret out of the log and the report, which anyone can read on a public repository. A
  # false positive (a test fixture) is allowed only in .gitleaks.toml, narrowly, with the reason beside it.
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make backend-checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .backend/go.mod
          cache: false
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: *tools-key
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools
      - name: gitleaks (whole history)
        run: >-
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
          --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
      - name: Summary of gitleaks
        if: always()
        env:
          SARIF: ${{ runner.temp }}/gitleaks.sarif
          TOOL: gitleaks
        run: *sarif-summary
      - name: Keep the gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gitleaks
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore

  # Security lint of every workflow with the pinned zizmor (make zizmor): any finding not left out in .github/zizmor.yml
  # fails the job. GITHUB_TOKEN, read-only here, turns on the online audits (impostor commits, actions with known
  # vulnerabilities); zizmor only reads public data with it.
  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make zizmor ZIZMOR_FORMAT=github
      - name: zizmor SARIF report
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make zizmor ZIZMOR_SARIF="$RUNNER_TEMP/zizmor.sarif"
      - name: Keep the zizmor report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-zizmor
          path: ${{ runner.temp }}/zizmor.sarif
          if-no-files-found: ignore

  # The dependencies a pull request adds or changes, against the GitHub Advisory Database: a known vulnerability of
  # severity high or critical fails the job before trivy and grype see it in the lockfile or the image. Licenses only
  # show in the job summary. Pull requests only: the action compares the pull request's base and head, so on any other
  # event the job is skipped, and ci-ok takes that skip for this job alone.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs-check

  # This pull request's web client end to end against the backend staging runs, the three repositories side by side as
  # in the lab's workspace. Outside ci-ok: a red stack (a flaky test, a Lighthouse threshold, an unsettled staging)
  # never blocks a merge. It runs with contents: read and no secret; its .env of random secrets is never printed or
  # uploaded, and its Valkey resets touch only this run's compose stack.
  stack:
    name: stack (end-to-end on the backend of staging, outside ci-ok)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    # Six pulls, one image build, the e2e seed, two browsers. The limit leaves room for a slow runner and stops a hung
    # step long before GitHub's default of 6 hours.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SVP_WEB_DIR: ${{ github.workspace }}/frontend
      SVP_BACKEND_DIR: ${{ github.workspace }}/backend
      SVP_GITOPS_DIR: ${{ github.workspace }}/gitops
    services:
      # The compose containers reach this as host.docker.internal, which compose's host-gateway maps to the gateway of
      # Docker's default bridge (docker0, 172.17.0.1). So it is published on that address and on loopback (psql of the
      # backend's Postgres bootstrap runs on the runner), never on every interface. Kafka and Valkey are containers of
      # the compose stack.
      postgres:
        image: docker.io/library/postgres:15.19-trixie@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
          - 172.17.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: frontend
          persist-credentials: false
      # The deployment configuration as main has it now, public, read with the job's read-only token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anhnvcoder/svp-gitops
          ref: main
          path: gitops
          persist-credentials: false
      # One full commit SHA or a red step: make stg-revision checks it before it goes into the checkout below.
      - id: stg
        name: The backend commit staging runs
        working-directory: frontend
        run: |
          revision=$(make -s stg-revision)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anhnvcoder/svp-backend
          ref: ${{ steps.stg.outputs.revision }}
          path: backend
          persist-credentials: false
      # An older backend would ignore IMAGES and build its six services from source, not what staging runs: stopped
      # here, before anything is built.
      - name: The backend there runs the releases of staging
        run: make -C frontend stg-check
      # make env runs go run ./tools/jwtkey for the JWT key pair, at the Go of that backend's go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # host-gateway is the gateway of the default bridge (unless the daemon sets host-gateway-ip), and Postgres
      # above is published on 172.17.0.1: if the two differ, every compose service fails to reach Postgres with a
      # timeout far from its cause. Said here, before anything is pulled or built.
      - run: make -C backend ci-bridge-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - id: pnpm
        name: Install pnpm
        working-directory: frontend
        run: *install-pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      # From Ubuntu's archive, no third-party action. psql is 16 here; the Postgres bootstrap SQL needs 15 or later.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client ffmpeg jq
      - run: make -C backend env
      - run: make -C backend up IMAGES=stg WEB_FROM=clone
      - run: make -C backend smoke
      - run: make -C frontend install
      - name: Install the Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      # Traces of failed tests stay in frontend/test-results/ on the runner: they hold session cookies and are never
      # uploaded.
      - run: make -C frontend e2e
      # make lighthouse launches Playwright's Chromium with Chrome's sandbox, which needs unprivileged user namespaces.
      # Ubuntu 24.04 restricts those through AppArmor for every binary without a profile of its own, and Playwright's
      # download has none, so Chrome stops with "No usable sandbox". The restriction is lifted on this throwaway runner,
      # so the sandbox stays on; the end-to-end tests turn it off themselves.
      - name: Let Chrome's sandbox use user namespaces
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)" = 1 ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "apparmor: kernel.apparmor_restrict_unprivileged_userns" \
            "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
      - id: lighthouse
        run: make -C frontend lighthouse
      - name: Container state
        if: failure()
        run: make -C backend ps
      # The reports lighthouse/run.sh wrote after replacing the session cookie in them (it deletes them when a cookie
      # value is still found). Its hidden .lighthouseci/ folder, with the results before that replacement, is matched by
      # neither pattern. Skipped when the step was cancelled mid-run or never ran.
      - name: Keep the Lighthouse reports
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: |
            frontend/test-results/lighthouse/*.html
            frontend/test-results/lighthouse/*.json
          if-no-files-found: ignore
      # Skipped only when the backend was never checked out (nothing was started then).
      - name: make down
        if: always() && hashFiles('backend/Makefile') != ''
        run: make -C backend down

  # The code scanning upload, the one job with a write permission. Only on main outside pull requests: a pull request
  # (from a branch of the repository or from a fork) runs its own code before anyone has read it, so it never gets
  # security-events: write. It checks the code out only so upload-sarif can fingerprint each finding, and runs nothing
  # of the repository. A report, not a check: not in ci-ok, but a failed upload still turns the run red.
  sarif:
    needs: [check, gitleaks, zizmor]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each report the jobs above left, in sarif/<artifact name>/; a job that stopped before writing its report left
      # none, and its upload below is skipped.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
      - if: hashFiles('sarif/sarif-gitleaks/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-gitleaks/gitleaks.sarif
          category: gitleaks
      - if: hashFiles('sarif/sarif-trivy-lockfile/trivy-lockfile.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-trivy-lockfile/trivy-lockfile.sarif
          category: trivy-lockfile
      - if: hashFiles('sarif/sarif-zizmor/zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-zizmor/zizmor.sarif
          category: zizmor

  # The required check: always(), and no condition may ever skip it (GitHub counts a skipped required check as passed).
  # Red unless every check job succeeded: a job that failed or was cancelled does not fail the jobs that need it by
  # itself. Two kinds of skip are part of a run: dependency-review outside pull requests, and a job whose area job
  # changes found untouched. Any other skip can only mean a wrong if: and is red too.
  ci-ok:
    needs: [changes, check, config, gitleaks, zizmor, dependency-review, docs]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every check job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          # skip_ok: dependency-review outside pull requests, and a job whose area job changes found untouched.
          jq -e --arg event "$EVENT" '
            .changes as $changes
            | {"check": "code", "config": "code", "zizmor": "workflows"} as $area
            | def skip_ok: (.key == "dependency-review" and $event != "pull_request")
                or ($changes.result == "success" and $area[.key] != null and $changes.outputs[$area[.key]] == "false");
            length == 7 and all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and skip_ok))
          ' <<< "$NEEDS" > /dev/null
